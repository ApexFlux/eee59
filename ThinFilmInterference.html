<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Interference Playground</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #020617; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
        /* Custom range slider styling */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Utility: Wavelength to RGB ---
        function wavelengthToRGB(wavelength) {
            let r, g, b, alpha;
            const wl = wavelength;
            if (wl >= 380 && wl < 440) { r = -(wl - 440) / (440 - 380); g = 0.0; b = 1.0; } 
            else if (wl >= 440 && wl < 490) { r = 0.0; g = (wl - 440) / (490 - 440); b = 1.0; } 
            else if (wl >= 490 && wl < 510) { r = 0.0; g = 1.0; b = -(wl - 510) / (510 - 490); } 
            else if (wl >= 510 && wl < 580) { r = (wl - 510) / (580 - 510); g = 1.0; b = 0.0; } 
            else if (wl >= 580 && wl < 645) { r = 1.0; g = -(wl - 645) / (645 - 580); b = 0.0; } 
            else if (wl >= 645 && wl <= 780) { r = 1.0; g = 0.0; b = 0.0; } 
            else { r = 0.0; g = 0.0; b = 0.0; }

            if (wl >= 380 && wl < 420) alpha = 0.3 + 0.7 * (wl - 380) / (420 - 380);
            else if (wl >= 420 && wl < 701) alpha = 1.0;
            else if (wl >= 701 && wl <= 780) alpha = 0.3 + 0.7 * (780 - wl) / (780 - 700);
            else alpha = 0.0;

            return {
                r: Math.round(r * alpha * 255),
                g: Math.round(g * alpha * 255),
                b: Math.round(b * alpha * 255),
                css: `rgb(${Math.round(r * alpha * 255)}, ${Math.round(g * alpha * 255)}, ${Math.round(b * alpha * 255)})`
            };
        }

        // ==========================================
        // COMPONENT 1: UNIFORM THIN FILM (Original)
        // ==========================================
        function UniformFilmView() {
            const canvasRef = useRef(null);
            const [thickness, setThickness] = useState(300);
            const [incidentAngleDeg, setIncidentAngleDeg] = useState(30);
            const [wavelength, setWavelength] = useState(550);
            const [preset, setPreset] = useState('soap');
            const [n1, setN1] = useState(1.0);
            const [n2, setN2] = useState(1.33);
            const [n3, setN3] = useState(1.0);
            
            const thetaI = (incidentAngleDeg * Math.PI) / 180;
            const sinThetaT = (n1 / n2) * Math.sin(thetaI);
            const thetaT = Math.asin(sinThetaT);
            const geoPathDiff = 2 * n2 * thickness * Math.cos(thetaT);
            const phaseShift1 = n2 > n1 ? Math.PI : 0;
            const phaseShift2 = n3 > n2 ? Math.PI : 0;
            const k0 = (2 * Math.PI) / wavelength;
            const phaseDiffRadias = k0 * geoPathDiff + (phaseShift2 - phaseShift1);
            const interferenceAmplitude = Math.abs(Math.cos(phaseDiffRadias / 2));

            const handlePresetChange = (e) => {
                const val = e.target.value;
                setPreset(val);
                if (val === 'soap') { setN1(1.0); setN2(1.33); setN3(1.0); }
                if (val === 'oil') { setN1(1.0); setN2(1.50); setN3(1.33); }
                if (val === 'ar') { setN1(1.0); setN2(1.38); setN3(1.52); }
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const scale = 0.5;
                
                const draw = () => {
                    const w = canvas.width; const h = canvas.height;
                    ctx.clearRect(0, 0, w, h);
                    
                    const topY = 100; const bottomY = topY + thickness * scale;
                    ctx.fillStyle = 'rgba(15, 23, 42, 1)'; ctx.fillRect(0, 0, w, topY); // bg-slate-900
                    ctx.fillStyle = `rgba(56, 189, 248, ${n2 * 0.15})`; ctx.fillRect(0, topY, w, bottomY - topY);
                    ctx.fillStyle = `rgba(15, 23, 42, 1)`; ctx.fillRect(0, bottomY, w, h - bottomY);

                    ctx.fillStyle = '#94a3b8'; ctx.font = '14px sans-serif';
                    ctx.fillText(`Medium 1 (n = ${n1.toFixed(2)})`, 20, 30);
                    ctx.fillText(`Film (n = ${n2.toFixed(2)})`, 20, topY + 25);
                    ctx.fillText(`Medium 3 (n = ${n3.toFixed(2)})`, 20, bottomY + 25);

                    const cx = w / 2 - 50; const L = 200;
                    const dxInc = -L * Math.sin(thetaI); const dyInc = -L * Math.cos(thetaI);
                    const dxRef1 = L * Math.sin(thetaI); const dyRef1 = -L * Math.cos(thetaI);
                    const dxTrans = (thickness * scale) * Math.tan(thetaT); const dyTrans = thickness * scale;
                    const dxRef2 = dxTrans; const dyRef2 = -dyTrans;
                    const dxOut = L * Math.sin(thetaI); const dyOut = -L * Math.cos(thetaI);

                    const color = wavelengthToRGB(wavelength).css;
                    ctx.strokeStyle = color; ctx.lineWidth = 2;

                    // Draw Rays
                    ctx.beginPath(); ctx.moveTo(cx + dxInc, topY + dyInc); ctx.lineTo(cx, topY); ctx.stroke(); // Incident
                    ctx.beginPath(); ctx.moveTo(cx, topY); ctx.lineTo(cx + dxRef1, topY + dyRef1); ctx.stroke(); // Reflected 1
                    ctx.beginPath(); ctx.moveTo(cx, topY); ctx.lineTo(cx + dxTrans, topY + dyTrans); ctx.stroke(); // Transmitted
                    ctx.beginPath(); ctx.moveTo(cx + dxTrans, topY + dyTrans); ctx.lineTo(cx + 2*dxTrans, topY); ctx.stroke(); // Reflected 2
                    ctx.beginPath(); ctx.moveTo(cx + 2*dxTrans, topY); ctx.lineTo(cx + 2*dxTrans + dxOut, topY + dyOut); ctx.stroke(); // Out

                    // Dots for phase shift
                    if (phaseShift1 > 0) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(cx, topY, 6, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.fillText("180° shift!", cx - 70, topY - 10);
                    }
                    if (phaseShift2 > 0) {
                        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(cx + dxTrans, topY + dyTrans, 6, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#fff'; ctx.fillText("180° shift!", cx + dxTrans + 10, topY + dyTrans + 15);
                    }
                };
                draw();
            }, [thickness, incidentAngleDeg, wavelength, n1, n2, n3]);

            return (
                <div className="flex flex-col md:flex-row gap-6 p-4">
                    <div className="flex-1 bg-slate-900 rounded-xl p-4 border border-slate-800 flex flex-col items-center">
                        <canvas ref={canvasRef} width={600} height={400} className="w-full max-w-2xl bg-slate-950 rounded-lg shadow-inner"></canvas>
                        <div className="mt-6 w-full max-w-2xl flex items-center gap-4 bg-slate-950 p-4 rounded-lg border border-slate-800">
                           <div className="text-sm font-semibold text-slate-400">Interference:</div>
                           <div className="flex-1 h-4 bg-slate-800 rounded-full overflow-hidden">
                              <div className="h-full transition-all duration-300" style={{ width: `${interferenceAmplitude * 100}%`, backgroundColor: wavelengthToRGB(wavelength).css }} />
                           </div>
                           <div className="text-sm font-bold w-24 text-right">
                             {interferenceAmplitude > 0.8 ? "Constructive" : interferenceAmplitude < 0.2 ? "Destructive" : "Partial"}
                           </div>
                        </div>
                    </div>
                    <div className="w-full md:w-80 bg-slate-900 p-6 rounded-xl border border-slate-800 flex flex-col gap-6">
                        <div>
                            <label className="text-sm mb-1 text-slate-400 block">Preset</label>
                            <select className="w-full bg-slate-800 border-none rounded p-2 text-white" value={preset} onChange={handlePresetChange}>
                                <option value="soap">Soap Bubble (Air &rarr; Water &rarr; Air)</option>
                                <option value="oil">Oil Slick (Air &rarr; Oil &rarr; Water)</option>
                                <option value="ar">Anti-Reflective (Air &rarr; MgF₂ &rarr; Glass)</option>
                            </select>
                        </div>
                        <div>
                            <label className="flex justify-between text-sm mb-1 text-slate-300"><span>Thickness (d)</span><span>{thickness} nm</span></label>
                            <input type="range" min="50" max="1000" value={thickness} onChange={e => setThickness(Number(e.target.value))} className="w-full" />
                        </div>
                        <div>
                            <label className="flex justify-between text-sm mb-1 text-slate-300"><span>Incident Angle (θ_i)</span><span>{incidentAngleDeg}°</span></label>
                            <input type="range" min="0" max="80" value={incidentAngleDeg} onChange={e => setIncidentAngleDeg(Number(e.target.value))} className="w-full" />
                        </div>
                        <div>
                            <label className="flex justify-between text-sm mb-1 text-slate-300"><span>Wavelength (λ)</span><span style={{color: wavelengthToRGB(wavelength).css}}>{wavelength} nm</span></label>
                            <input type="range" min="380" max="750" value={wavelength} onChange={e => setWavelength(Number(e.target.value))} className="w-full" />
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // COMPONENT 2: INCLINED PLATES (WEDGE)
        // ==========================================
        function WedgeFilmView() {
            const canvasRef = useRef(null);
            const fringeCanvasRef = useRef(null);
            const [wedgeAngle, setWedgeAngle] = useState(0.02); // degrees
            const [wavelength, setWavelength] = useState(500);

            useEffect(() => {
                const colorInfo = wavelengthToRGB(wavelength);
                
                // 1. Draw Side Profile
                const ctx = canvasRef.current.getContext('2d');
                ctx.clearRect(0, 0, 400, 300);
                
                // Draw bottom plate
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(50, 200, 300, 20);
                
                // Draw top plate angled
                const angleRad = wedgeAngle * (Math.PI / 180);
                ctx.save();
                ctx.translate(50, 200); // Anchor at touch point
                ctx.rotate(-angleRad * 50); // Multiply angle for visual exaggeration
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(0, -20, 300, 20);
                ctx.restore();
                
                // Labels
                ctx.fillStyle = '#94a3b8'; ctx.font = '14px sans-serif';
                ctx.fillText("Air Gap (n=1)", 150, 180);
                ctx.fillText("Glass", 150, 240);
                ctx.fillText("Contact point", 30, 240);
                
                // 2. Draw Fringes (Top Down View)
                const fCtx = fringeCanvasRef.current.getContext('2d');
                const w = fringeCanvasRef.current.width;
                const h = fringeCanvasRef.current.height;
                const imgData = fCtx.createImageData(w, h);
                
                // We assume n=1 for air gap. Shift = pi (at bottom glass boundary).
                // d = x * tan(angle).
                // Phase diff = (4*pi*d) / lambda + pi
                
                for(let x=0; x<w; x++) {
                    // map x to physical distance (e.g. 0 to 50mm)
                    const xPhysical = (x / w) * 50000000; // nm
                    const d = xPhysical * Math.tan(angleRad);
                    const phase = (4 * Math.PI * d) / wavelength + Math.PI;
                    const intensity = Math.pow(Math.cos(phase / 2), 2);
                    
                    for(let y=0; y<h; y++) {
                        const idx = (y * w + x) * 4;
                        imgData.data[idx] = colorInfo.r * intensity;
                        imgData.data[idx+1] = colorInfo.g * intensity;
                        imgData.data[idx+2] = colorInfo.b * intensity;
                        imgData.data[idx+3] = 255;
                    }
                }
                fCtx.putImageData(imgData, 0, 0);

            }, [wedgeAngle, wavelength]);

            return (
                <div className="flex flex-col md:flex-row gap-6 p-4">
                    <div className="flex-1 flex flex-col gap-4">
                        <div className="bg-slate-900 rounded-xl p-4 border border-slate-800">
                            <h3 className="text-center text-slate-400 mb-2 font-semibold">Side View (Cross-section)</h3>
                            <canvas ref={canvasRef} width={400} height={300} className="w-full bg-slate-950 rounded shadow-inner"></canvas>
                        </div>
                        <div className="bg-slate-900 rounded-xl p-4 border border-slate-800">
                            <h3 className="text-center text-slate-400 mb-2 font-semibold">Top View (Fringe Pattern)</h3>
                            <canvas ref={fringeCanvasRef} width={600} height={100} className="w-full bg-black rounded shadow-inner border border-slate-700"></canvas>
                        </div>
                    </div>
                    <div className="w-full md:w-80 bg-slate-900 p-6 rounded-xl border border-slate-800 flex flex-col gap-6">
                        <div className="text-sm text-slate-400 mb-4">
                            When two plates form a tiny wedge, the air gap thickness ($d$) increases linearly. This creates straight, parallel interference fringes.
                        </div>
                        <div>
                            <label className="flex justify-between text-sm mb-1 text-slate-300"><span>Wedge Angle (α)</span><span>{wedgeAngle.toFixed(3)}°</span></label>
                            <input type="range" min="0.005" max="0.05" step="0.001" value={wedgeAngle} onChange={e => setWedgeAngle(Number(e.target.value))} className="w-full" />
                        </div>
                        <div>
                            <label className="flex justify-between text-sm mb-1 text-slate-300"><span>Wavelength (λ)</span><span style={{color: wavelengthToRGB(wavelength).css}}>{wavelength} nm</span></label>
                            <input type="range" min="380" max="750" value={wavelength} onChange={e => setWavelength(Number(e.target.value))} className="w-full" />
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // COMPONENT 3: NEWTON'S RINGS
        // ==========================================
        function NewtonsRingsView() {
            const canvasRef = useRef(null);
            const fringeCanvasRef = useRef(null);
            const [lensRadius, setLensRadius] = useState(2.0); // meters
            const [wavelength, setWavelength] = useState(550); // nm

            useEffect(() => {
                const colorInfo = wavelengthToRGB(wavelength);
                
                // 1. Draw Side Profile
                const ctx = canvasRef.current.getContext('2d');
                ctx.clearRect(0, 0, 400, 200);
                
                // Draw bottom plate
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(50, 150, 300, 20);
                
                // Draw lens curve (exaggerated for visual)
                ctx.beginPath();
                ctx.arc(200, 150 - (500/lensRadius), (500/lensRadius), Math.PI*0.8, Math.PI*0.2, true);
                ctx.lineTo(350, 50); ctx.lineTo(50, 50); ctx.closePath();
                ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
                ctx.fill();
                
                ctx.fillStyle = '#94a3b8'; ctx.font = '14px sans-serif';
                ctx.fillText("Air Gap", 180, 145);
                ctx.fillText("Plano-Convex Lens", 140, 100);
                
                // 2. Draw Fringes (Top Down View)
                const fCtx = fringeCanvasRef.current.getContext('2d');
                const w = fringeCanvasRef.current.width;
                const h = fringeCanvasRef.current.height;
                const imgData = fCtx.createImageData(w, h);
                const cx = w/2; const cy = h/2;
                
                // Physics: d = r^2 / (2R). 
                // Phase diff = (4*pi*d)/lambda + pi (due to reflection off bottom glass).
                
                for(let y=0; y<h; y++) {
                    for(let x=0; x<w; x++) {
                        const dx = x - cx; const dy = y - cy;
                        const rPixels = Math.sqrt(dx*dx + dy*dy);
                        // Map pixel radius to physical radius (e.g. up to 10mm)
                        const rPhysical = (rPixels / (w/2)) * 0.01; // meters
                        
                        const d = (rPhysical * rPhysical) / (2 * lensRadius); // meters
                        const d_nm = d * 1e9; // convert to nm for wavelength math
                        
                        const phase = (4 * Math.PI * d_nm) / wavelength + Math.PI;
                        const intensity = Math.pow(Math.cos(phase / 2), 2);
                        
                        const idx = (y * w + x) * 4;
                        imgData.data[idx] = colorInfo.r * intensity;
                        imgData.data[idx+1] = colorInfo.g * intensity;
                        imgData.data[idx+2] = colorInfo.b * intensity;
                        imgData.data[idx+3] = 255;
                    }
                }
                fCtx.putImageData(imgData, 0, 0);

            }, [lensRadius, wavelength]);

            return (
                <div className="flex flex-col md:flex-row gap-6 p-4">
                    <div className="flex-1 flex flex-col gap-4">
                        <div className="bg-slate-900 rounded-xl p-4 border border-slate-800">
                            <h3 className="text-center text-slate-400 mb-2 font-semibold">Side View</h3>
                            <canvas ref={canvasRef} width={400} height={200} className="w-full bg-slate-950 rounded shadow-inner"></canvas>
                        </div>
                        <div className="bg-slate-900 rounded-xl p-4 border border-slate-800 flex justify-center">
                            <div className="text-center">
                                <h3 className="text-slate-400 mb-2 font-semibold">Top View (Newton's Rings)</h3>
                                <canvas ref={fringeCanvasRef} width={300} height={300} className="bg-black rounded-full shadow-[0_0_20px_rgba(0,0,0,1)] border-4 border-slate-800"></canvas>
                            </div>
                        </div>
                    </div>
                    <div className="w-full md:w-80 bg-slate-900 p-6 rounded-xl border border-slate-800 flex flex-col gap-6">
                        <div className="text-sm text-slate-400 mb-4 leading-relaxed">
                            A curved lens on a flat plate creates an air gap that expands radially. The thickness ($d = r^2/2R$) creates concentric circles. The very center is dark because the thickness is 0, leaving only the 180° phase shift.
                        </div>
                        <div>
                            <label className="flex justify-between text-sm mb-1 text-slate-300"><span>Lens Curvature (R)</span><span>{lensRadius.toFixed(1)} m</span></label>
                            <input type="range" min="0.5" max="5.0" step="0.1" value={lensRadius} onChange={e => setLensRadius(Number(e.target.value))} className="w-full" />
                        </div>
                        <div>
                            <label className="flex justify-between text-sm mb-1 text-slate-300"><span>Wavelength (λ)</span><span style={{color: wavelengthToRGB(wavelength).css}}>{wavelength} nm</span></label>
                            <input type="range" min="380" max="750" value={wavelength} onChange={e => setWavelength(Number(e.target.value))} className="w-full" />
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // COMPONENT 4: EXPLAINING THETA_T
        // ==========================================
        function ThetaExplanationView() {
            const canvasRef = useRef(null);
            const [angleI, setAngleI] = useState(45); // degrees
            const n1 = 1.0; // Air
            const n2 = 1.5; // Glass

            // Snell's Law
            const thetaI_rad = angleI * (Math.PI/180);
            const sinThetaT = (n1 / n2) * Math.sin(thetaI_rad);
            const thetaT_rad = Math.asin(sinThetaT);
            const angleT = thetaT_rad * (180/Math.PI);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const w = canvas.width; const h = canvas.height;
                const cx = w/2; const cy = h/2;

                // Draw Media
                ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, w, cy); // Air
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0, cy, w, h-cy); // Glass

                // Draw Normal Line
                ctx.beginPath(); ctx.setLineDash([5, 5]); ctx.moveTo(cx, 20); ctx.lineTo(cx, h-20);
                ctx.strokeStyle = '#64748b'; ctx.stroke(); ctx.setLineDash([]);

                // Draw Rays
                const L = 150;
                const dxI = -L * Math.sin(thetaI_rad); const dyI = -L * Math.cos(thetaI_rad);
                const dxT = L * Math.sin(thetaT_rad); const dyT = L * Math.cos(thetaT_rad);

                // Incident
                ctx.beginPath(); ctx.moveTo(cx + dxI, cy + dyI); ctx.lineTo(cx, cy);
                ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.stroke();
                
                // Transmitted
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + dxT, cy + dyT);
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.stroke();

                // Draw Angles (Arcs)
                ctx.beginPath(); ctx.arc(cx, cy, 40, Math.PI * 1.5, Math.PI * 1.5 - thetaI_rad, true);
                ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#fbbf24'; ctx.font = '16px sans-serif'; ctx.fillText(`θ_i = ${angleI.toFixed(1)}°`, cx - 70, cy - 50);

                ctx.beginPath(); ctx.arc(cx, cy, 50, Math.PI * 0.5, Math.PI * 0.5 - thetaT_rad, true);
                ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#38bdf8'; ctx.fillText(`θ_t = ${angleT.toFixed(1)}°`, cx + 20, cy + 80);

            }, [angleI]);

            return (
                <div className="flex flex-col md:flex-row gap-6 p-4">
                    <div className="flex-1 bg-slate-900 rounded-xl p-4 border border-slate-800 flex flex-col items-center">
                        <canvas ref={canvasRef} width={400} height={400} className="bg-black rounded shadow-inner"></canvas>
                        <div className="mt-6 w-full max-w-sm">
                            <label className="flex justify-between text-sm mb-1 text-slate-300">
                                <span>Change Incident Angle (θ_i)</span><span>{angleI}°</span>
                            </label>
                            <input type="range" min="0" max="85" value={angleI} onChange={e => setAngleI(Number(e.target.value))} className="w-full" />
                        </div>
                    </div>
                    <div className="w-full md:w-1/2 bg-slate-900 p-6 rounded-xl border border-slate-800 flex flex-col gap-4 overflow-y-auto">
                        <h2 className="text-2xl font-bold text-white mb-2">What is θ_t ?</h2>
                        
                        <p className="text-slate-300 leading-relaxed">
                            <strong>θ_t</strong> stands for the <strong>angle of the transmitted ray</strong> (also known as the angle of refraction). 
                        </p>
                        
                        <div className="bg-slate-800 p-4 rounded-lg border-l-4 border-blue-500">
                            <h4 className="font-bold text-white mb-1">The "Shopping Cart" Analogy</h4>
                            <p className="text-sm text-slate-400">
                                Imagine pushing a shopping cart from smooth pavement (Air) into thick, muddy grass (Glass) at an angle. 
                                The right wheel hits the mud first and slows down, while the left wheel is still moving fast on the pavement. 
                                This causes the entire cart to <strong>pivot and turn inward</strong> toward the straight-down line (the normal).
                            </p>
                        </div>

                        <p className="text-slate-300 leading-relaxed text-sm">
                            Because light travels slower in denser materials (like glass or water) than it does in air, it bends when it crosses the boundary. 
                        </p>

                        <div className="bg-slate-950 p-4 rounded font-mono text-sm text-center border border-slate-800 text-slate-300">
                            <strong>Snell's Law:</strong><br/>
                            <span className="text-amber-400">n₁ × sin(θ_i)</span> = <span className="text-blue-400">n₂ × sin(θ_t)</span>
                        </div>

                        <p className="text-slate-300 leading-relaxed text-sm">
                            In thin-film interference, this bending is crucial! The light doesn't just go straight down and straight back up; it travels on a diagonal. The angle <strong>θ_t</strong> is used to calculate exactly how much extra diagonal distance the light travels inside the film ($2d \times \cos(\theta_t)$).
                        </p>
                    </div>
                </div>
            );
        }

        // ==========================================
        // MAIN APPLICATION (TAB SYSTEM)
        // ==========================================
        function App() {
            const [activeTab, setActiveTab] = useState('uniform');

            return (
                <div className="min-h-screen flex flex-col max-w-6xl mx-auto p-4">
                    <header className="mb-6">
                        <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">
                            Optical Interference Visualizer
                        </h1>
                        <p className="text-slate-400">Explore how light waves cancel or reinforce each other across different physical geometries.</p>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="flex flex-wrap gap-2 mb-6 border-b border-slate-800 pb-2">
                        {[
                            { id: 'uniform', label: 'Uniform Thin Film' },
                            { id: 'wedge', label: 'Wedge (Inclined Plates)' },
                            { id: 'newtons', label: "Newton's Rings" },
                            { id: 'theta', label: 'What is θ_t?' }
                        ].map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-4 py-2 rounded-t-lg font-medium transition-colors ${
                                    activeTab === tab.id 
                                    ? 'bg-blue-600 text-white' 
                                    : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    {/* Active View */}
                    <main className="flex-1 bg-slate-950 rounded-b-xl border border-slate-800 shadow-2xl overflow-hidden">
                        {activeTab === 'uniform' && <UniformFilmView />}
                        {activeTab === 'wedge' && <WedgeFilmView />}
                        {activeTab === 'newtons' && <NewtonsRingsView />}
                        {activeTab === 'theta' && <ThetaExplanationView />}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
